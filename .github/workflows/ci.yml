name: Build and Deploy

on:
  pull_request:
  push:
    branches: [main, "agent/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run build
      - run: npx opennextjs-cloudflare build

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - name: Build and deploy to Cloudflare Workers
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Capture Worker runtime error
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          timeout 30s npx wrangler tail ziwei-doushu --format pretty > worker-tail.log 2>&1 &
          TAIL_PID=$!
          sleep 8
          curl --silent --show-error --max-time 20 --output response.txt --write-out "HTTP %{http_code}\n" https://ziwei-doushu.wanghe3933.workers.dev/ || true
          sleep 8
          kill $TAIL_PID 2>/dev/null || true
          wait $TAIL_PID 2>/dev/null || true
          echo "===== Worker response ====="
          head -c 2000 response.txt 2>/dev/null || true
          echo
          echo "===== Worker runtime log ====="
          cat worker-tail.log
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
