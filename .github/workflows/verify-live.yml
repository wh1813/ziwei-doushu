name: verify-live

# 部署后手动触发的线上验收：页面可达 + 排盘 API 黄金案例对比 + 解盘 SSE 冒烟
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://symgxm.hulu.kdns.fr
    steps:
      - name: Probe routes
        run: |
          for path in / /qimen /liuyao /tianji /chart; do
            code=$(curl -s -o /tmp/probe.html -w "%{http_code}" "$BASE_URL$path")
            echo "GET $path -> HTTP $code ($(wc -c < /tmp/probe.html) bytes)"
            if [ "$code" != "200" ]; then
              echo "--- body of $path ---"
              cat /tmp/probe.html; echo
            fi
          done

      - name: Detailed /qimen diagnostics
        run: |
          echo "--- headers ---"
          curl -s -D - -o /tmp/qimen.html "$BASE_URL/qimen" | head -20
          echo "--- full body ---"
          cat /tmp/qimen.html; echo

      - name: Golden check /api/qimen-chart (2026-03-24 10:30)
        run: |
          code=$(curl -s -o /tmp/chart.json -w "%{http_code}" -X POST "$BASE_URL/api/qimen-chart" \
            -H "Content-Type: application/json" \
            -d '{"solarDate":"2026-03-24","timeIndex":5,"questionType":"事业"}')
          echo "POST /api/qimen-chart -> HTTP $code"
          if [ "$code" != "200" ]; then
            echo "--- error body ---"; cat /tmp/chart.json; echo; exit 1
          fi
          python3 - <<'PY'
          import json, sys
          live = json.load(open("/tmp/chart.json"))
          chart = live.get("chart") or {}
          def g(d, *names):
              for n in names:
                  if n in d: return d[n]
              return None
          checks = [
              ("active_jie",  g(live.get("jieqi") or {}, "activeJie"), "惊蛰"),
              ("dun_type",    g(chart, "dunType", "dun_type"),          "阳遁"),
              ("ju_number",   g(chart, "juNumber", "ju_number"),        1),
              ("yuan",        g(chart, "yuan"),                          "上元"),
              ("hidden_yi",   g(chart, "hiddenYi", "hidden_yi"),       "壬"),
              ("zhifu.star",  (g(chart, "zhifu") or {}).get("star"),    "天芮"),
              ("zhifu.palace",(g(chart, "zhifu") or {}).get("palace"),  9),
              ("zhishi.door", (g(chart, "zhishi") or {}).get("door"),   "死门"),
              ("zhishi.palace",(g(chart, "zhishi") or {}).get("palace"), 9),
          ]
          fails = 0
          for name, got, want in checks:
              ok = got == want
              print(("OK  " if ok else "FAIL") + f" {name}: live={got} expect={want}")
              fails += 0 if ok else 1
          pal = g(chart, "palaces") or []
          print("palaces:", len(pal), "| patterns:", len(g(chart, "detectedPatterns", "detected_patterns") or []))
          if fails or len(pal) != 9:
              sys.exit(f"{fails} golden mismatches / palaces={len(pal)}")
          print("GOLDEN LIVE CHECK: ALL MATCH")
          PY

      - name: Golden check /api/qimen-chart (birth info 1994-05-21)
        run: |
          code=$(curl -s -o /tmp/chart_birth.json -w "%{http_code}" -X POST "$BASE_URL/api/qimen-chart" \
            -H "Content-Type: application/json" \
            -d '{"solarDate":"2026-03-24","timeIndex":5,"questionType":"感情","birthDate":"1994-05-21","birthTimeIndex":1}')
          echo "POST /api/qimen-chart(birth) -> HTTP $code"
          if [ "$code" != "200" ]; then
            echo "--- error body ---"; cat /tmp/chart_birth.json; echo; exit 1
          fi
          code2=$(curl -s -o /tmp/chart_nobirth.json -w "%{http_code}" -X POST "$BASE_URL/api/qimen-chart" \
            -H "Content-Type: application/json" \
            -d '{"solarDate":"2026-03-24","timeIndex":5,"questionType":"事业"}')
          echo "POST /api/qimen-chart(no birth) -> HTTP $code2"
          if [ "$code2" != "200" ]; then
            echo "--- error body ---"; cat /tmp/chart_nobirth.json; echo; exit 1
          fi
          python3 - <<'PY'
          import json, sys
          live = json.load(open("/tmp/chart_birth.json"))
          p = live.get("personal") or {}
          bazi = p.get("baZi") or {}
          selfp = p.get("self") or {}
          partner = p.get("partner") or {}
          ys = p.get("yearSymbol") or {}
          zf = ys.get("zhifuProxy") or {}
          uf = live.get("chartUnfavorable") or {}
          checks = [
              ("personal.notnull",     bool(p),                                       True),
              ("baZi.dayGanZhi",       bazi.get("dayGanZhi"),                         "丁未"),
              ("baZi.yearGanZhi",      bazi.get("yearGanZhi"),                        "甲戌"),
              ("self.symbol",          selfp.get("displaySymbol"),                    "丁"),
              ("self.role",            selfp.get("role"),                             "本人（八字日干）"),
              ("partner.symbol",       partner.get("displaySymbol"),                  "壬"),
              ("yearSymbol.zhifuProxy", bool(zf.get("star")),                         True),
              ("yearSymbol.proxyStem", ys.get("sourceStem"),                          "戊"),
              ("chartUnfavorable.arr", isinstance(uf.get("jiXing"), list) and isinstance(uf.get("ruMu"), list), True),
          ]
          fails = 0
          for name, got, want in checks:
              ok = got == want
              print(("OK  " if ok else "FAIL") + f" {name}: live={got} expect={want}")
              fails += 0 if ok else 1
          if fails:
              sys.exit(f"{fails} birth-info mismatches")
          live2 = json.load(open("/tmp/chart_nobirth.json"))
          if live2.get("personal") is not None:
              sys.exit("no-birth request should return personal=null")
          print("NO-BIRTH CHECK: personal=null OK")
          print("BIRTH-INFO LIVE CHECK: ALL MATCH")
          PY

      - name: Probe /api/qimen-history
        run: |
          code=$(curl -s -o /tmp/qh.json -w "%{http_code}" "$BASE_URL/api/qimen-history?limit=5")
          echo "GET /api/qimen-history?limit=5 -> HTTP $code"
          if [ "$code" != "404" ]; then
            echo "::error::qimen-history should be removed (public listing leaks visitors' questions); expected 404, got $code"
            cat /tmp/qh.json; echo
            exit 1
          fi
          echo "QIMEN-HISTORY REMOVAL CHECK: PASS (endpoint no longer exposed)"

      - name: Smoke test /api/qimen-interpret (SSE)
        run: |
          set +e
          code=$(curl -s -o /tmp/interp.txt -w "%{http_code}" --max-time 180 \
            -X POST "$BASE_URL/api/qimen-interpret" \
            -H "Content-Type: application/json" \
            -d '{"solarDate":"2026-03-24","timeIndex":5,"questionType":"事业","birthDate":"1994-05-21","birthTimeIndex":1}')
          curl_rc=$?
          set -e
          echo "POST /api/qimen-interpret -> HTTP $code (curl rc=$curl_rc)"
          head -c 300 /tmp/interp.txt; echo
          if [ "$code" = "200" ]; then
            echo "interpret SSE OK"
          elif [ "$code" = "503" ]; then
            echo "::warning::interpret 503 - AI provider key likely not set on Worker (chart path unaffected)"
          elif [ "$curl_rc" = "28" ] || [ "$code" = "000" ]; then
            echo "::warning::interpret SSE timed out after 180s - upstream free-model queuing latency (provider-side, chart path unaffected, not a deploy defect)"
          else
            echo "::error::unexpected status $code"
            exit 1
          fi

      - name: Probe /liuyao page
        run: |
          code=$(curl -s -o /tmp/liuyao.html -w "%{http_code}" "$BASE_URL/liuyao")
          echo "GET /liuyao -> HTTP $code ($(wc -c < /tmp/liuyao.html) bytes)"
          if [ "$code" != "200" ]; then
            echo "--- body ---"; cat /tmp/liuyao.html; echo; exit 1
          fi
          # 简单 grep：页面必须含「六爻 · 起卦解卦」标题
          if ! grep -q "六爻 · 起卦解卦" /tmp/liuyao.html; then
            echo "::error::liuyao page missing header"; head -100 /tmp/liuyao.html; exit 1
          fi
          echo "LIUYAO PAGE: PASS"

      - name: Golden check /api/liuyao-chart (2024-09-15 申时, 求财, 男)
        run: |
          code=$(curl -s -o /tmp/ly_chart.json -w "%{http_code}" -X POST "$BASE_URL/api/liuyao-chart" \
            -H "Content-Type: application/json" \
            -d '{"solarDate":"2024-09-15","timeIndex":8,"questionType":"求财","questionGoal":"测试","method":"time","gender":"男"}')
          echo "POST /api/liuyao-chart -> HTTP $code"
          if [ "$code" != "200" ]; then
            echo "--- error body ---"; cat /tmp/ly_chart.json; echo; exit 1
          fi
          python3 - <<'PY'
          import json, sys
          live = json.load(open("/tmp/ly_chart.json"))
          chart = live.get("chart") or {}
          ganzhi = live.get("ganzhi") or {}
          yongshen = live.get("yongShen") or {}
          yaos = chart.get("yaoList") or []
          checks = [
              ("benGua",                chart.get("benGua"),                              "乾为天"),
              ("bianGua",               chart.get("bianGua"),                             "天火同人"),
              ("guaGong",               chart.get("guaGong"),                             "乾宫"),
              ("guaGongWuxing",         chart.get("guaGongWuxing"),                       "金"),
              ("shiYaoIndex",           chart.get("shiYaoIndex"),                         6),
              ("yingYaoIndex",          chart.get("yingYaoIndex"),                        3),
              ("dongYaoIndices",        chart.get("dongYaoIndices"),                      [1]),
              ("liuqinOfSelf",          chart.get("liuqinOfSelf"),                        "父母"),
              ("dayGanzhi",             ganzhi.get("day"),                                "壬午"),
              ("yongShen.name",         yongshen.get("name"),                             "妻财爻：甲寅（木）"),
              ("yongShen.position",     yongshen.get("position"),                         2),
              ("yaoList.length",        len(yaos),                                       6),
              ("y1.position",           yaos[0].get("position") if len(yaos)>=1 else None, 1),
              ("y6.position",           yaos[5].get("position") if len(yaos)>=6 else None, 6),
              ("y1.isDong",             yaos[0].get("isDong") if len(yaos)>=1 else None,  True),
              ("y2.liuqin",             yaos[1].get("liuqin") if len(yaos)>=2 else None, "妻财"),
              ("y6.isShi",              yaos[5].get("isShi") if len(yaos)>=6 else None,  True),
              ("y3.isYing",             yaos[2].get("isYing") if len(yaos)>=3 else None, True),
              ("y1.liushou",            yaos[0].get("liushou") if len(yaos)>=1 else None,"青龙"),
              ("y1.bianYinYang",        yaos[0].get("bianYinYang") if len(yaos)>=1 else None,"阴"),
              ("y1.bianGan",            yaos[0].get("bianGan") if len(yaos)>=1 else None,"己"),
              ("y1.bianZhi",            yaos[0].get("bianZhi") if len(yaos)>=1 else None,"卯"),
          ]
          fails = 0
          for name, got, want in checks:
              ok = got == want
              print(("OK  " if ok else "FAIL") + f" {name}: live={got!r} expect={want!r}")
              fails += 0 if ok else 1
          # recordId 是 best-effort：迁移 0005 已应用 → 应有；未应用 → null（设计如此，不阻塞排卦）
          if live.get("recordId"):
              print(f"OK   recordId: live={live['recordId']!r} (sixyao_records 落库已生效)")
          else:
              print("::warning::recordId 为空：sixyao_records 表可能未建/迁移 0005 未应用；best-effort 不阻塞")
          if fails:
              sys.exit(f"{fails} liuyao golden mismatches")
          print("LIUYAO GOLDEN LIVE CHECK: ALL MATCH")
          PY

      - name: Validation check /api/liuyao-chart (bad input)
        run: |
          code=$(curl -s -o /tmp/ly_bad.json -w "%{http_code}" -X POST "$BASE_URL/api/liuyao-chart" \
            -H "Content-Type: application/json" \
            -d '{"solarDate":"not-a-date","timeIndex":8,"method":"time"}')
          echo "POST /api/liuyao-chart(bad date) -> HTTP $code"
          if [ "$code" != "400" ]; then
            echo "::error::expected 400 for bad date, got $code"; cat /tmp/ly_bad.json; exit 1
          fi
          echo "BAD-INPUT CHECK: PASS (HTTP 400)"

      - name: Smoke test /api/liuyao-interpret (SSE)
        run: |
          set +e
          # 先起卦拿 recordId
          chart_json=$(curl -s -X POST "$BASE_URL/api/liuyao-chart" \
            -H "Content-Type: application/json" \
            -d '{"solarDate":"2024-09-15","timeIndex":8,"questionType":"求财","questionGoal":"测试","method":"time","gender":"男"}')
          record_id=$(echo "$chart_json" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('recordId') or '')")
          echo "Got recordId: ${record_id:-<none>}"
          code=$(curl -s -o /tmp/ly_interp.txt -w "%{http_code}" --max-time 180 \
            -X POST "$BASE_URL/api/liuyao-interpret" \
            -H "Content-Type: application/json" \
            -d "{\"solarDate\":\"2024-09-15\",\"timeIndex\":8,\"questionType\":\"求财\",\"questionGoal\":\"测试\",\"method\":\"time\",\"gender\":\"男\",\"recordId\":\"$record_id\"}")
          curl_rc=$?
          set -e
          echo "POST /api/liuyao-interpret -> HTTP $code (curl rc=$curl_rc)"
          head -c 300 /tmp/ly_interp.txt; echo
          if [ "$code" = "200" ]; then
            echo "liuyao interpret SSE OK"
          elif [ "$code" = "503" ]; then
            echo "::warning::liuyao interpret 503 - AI provider key likely not set on Worker (chart path unaffected)"
          elif [ "$curl_rc" = "28" ] || [ "$code" = "000" ]; then
            echo "::warning::liuyao interpret SSE timed out after 180s - upstream free-model queuing latency (provider-side, chart path unaffected, not a deploy defect)"
          else
            echo "::error::unexpected status $code"
            exit 1
          fi
