name: verify-live

# 部署后手动触发的线上验收：页面可达 + 排盘 API 黄金案例对比 + 解盘 SSE 冒烟
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://ziwei-doushu.wanghe3933.workers.dev
    steps:
      - name: Check /qimen page
        run: |
          code=$(curl -s -o /tmp/qimen.html -w "%{http_code}" "$BASE_URL/qimen")
          size=$(wc -c < /tmp/qimen.html)
          echo "GET /qimen -> HTTP $code ($size bytes)"
          if [ "$code" != "200" ]; then echo "::error::page not 200"; exit 1; fi
          grep -q "奇门" /tmp/qimen.html && echo "page contains 奇门: OK"

      - name: Golden check /api/qimen-chart (2026-03-24 10:30)
        run: |
          curl -s -X POST "$BASE_URL/api/qimen-chart" \
            -H "Content-Type: application/json" \
            -d '{"solarDate":"2026-03-24","timeIndex":5,"questionType":"事业"}' \
            -o /tmp/chart.json
          echo "chart response bytes: $(wc -c < /tmp/chart.json)"
          python3 - <<'PY'
          import json, sys
          live = json.load(open("/tmp/chart.json"))
          def g(d, *names):
              for n in names:
                  if n in d: return d[n]
              return None
          checks = [
              ("dun_type",    g(live, "dunType", "dun_type"),          "阳遁"),
              ("ju_number",   g(live, "juNumber", "ju_number"),        1),
              ("yuan",        g(live, "yuan"),                          "上元"),
              ("hidden_yi",   g(live, "hiddenYi", "hidden_yi"),        "壬"),
              ("zhifu.star",  (g(live, "zhifu") or {}).get("star"),    "天芮"),
              ("zhifu.palace",(g(live, "zhifu") or {}).get("palace"),  9),
              ("zhishi.door", (g(live, "zhishi") or {}).get("door"),   "死门"),
              ("zhishi.palace",(g(live, "zhishi") or {}).get("palace"),9),
          ]
          fails = 0
          for name, got, want in checks:
              ok = got == want
              print(("OK  " if ok else "FAIL") + f" {name}: live={got} expect={want}")
              fails += 0 if ok else 1
          pal = g(live, "palaces") or {}
          print("palaces:", len(pal), "| patterns:", g(live, "detectedPatterns", "detected_patterns"))
          if fails or len(pal) != 9:
              sys.exit(f"{fails} golden mismatches / palaces={len(pal)}")
          print("GOLDEN LIVE CHECK: ALL MATCH")
          PY

      - name: Smoke test /api/qimen-interpret (SSE)
        run: |
          code=$(curl -s -o /tmp/interp.txt -w "%{http_code}" --max-time 60 \
            -X POST "$BASE_URL/api/qimen-interpret" \
            -H "Content-Type: application/json" \
            -d '{"solarDate":"2026-03-24","timeIndex":5,"questionType":"事业"}')
          ctype=$(curl -s -o /dev/null -w "%{content_type}" --max-time 60 \
            -X POST "$BASE_URL/api/qimen-interpret" \
            -H "Content-Type: application/json" \
            -d '{"solarDate":"2026-03-24","timeIndex":5,"questionType":"事业"}')
          echo "POST /api/qimen-interpret -> HTTP $code, content-type: $ctype"
          head -c 300 /tmp/interp.txt; echo
          # 200 + event-stream 即链路通；503 说明 AI key 未配置（chart 不受影响）
          if [ "$code" = "200" ]; then
            echo "interpret SSE OK"
          elif [ "$code" = "503" ]; then
            echo "::warning::interpret 503 - AI provider key likely not set on Worker (chart path unaffected)"
          else
            echo "::error::unexpected status $code"
            exit 1
          fi
