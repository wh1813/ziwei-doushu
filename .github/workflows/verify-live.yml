      - name: R18-7 fortune center page + entry check
        run: |
          python3 - <<'PY'
          import urllib.request, sys
          BASE = 'https://symgxm.hulu.kdns.fr'
          UA = {'User-Agent': 'workbuddy-verify/1.0 (+https://github.com/wh1813/ziwei-doushu)'}
          def fetch(path):
              req = urllib.request.Request(BASE + path, headers=UA)
              return urllib.request.urlopen(req, timeout=30).read().decode('utf-8', errors='replace')

          # 1) /fortune 页面探针：必须能 200 + 含 运势中心 / 聚焦 / 时间范围 关键词
          html = fetch('/fortune')
          fails = 0
          if len(html) < 1000:
              print(f'FAIL /fortune page too small: {len(html)} bytes')
              fails += 1
          else:
              must = ['运势中心', '聚焦', '时间范围', 'qimen', 'liuyao', 'daliuren', 'xiaoliuren', 'data-banner="fortune"']
              missing = [m for m in must if m not in html]
              if missing:
                  print(f'FAIL /fortune missing keywords: {missing}')
                  fails += 1
              else:
                  print(f'OK   /fortune size={len(html)}  all keywords present')

          # 2) 首页必须含运势中心入口 + TopNav 7 项
          # 注意：卡片是 <button> 用 router.push，无 href 字面量；探针只查关键文本
          home = fetch('/')
          must_home = ['运势中心', '跨盘印证']
          miss_home = [m for m in must_home if m not in home]
          if miss_home:
              print(f'FAIL / homepage missing fortune entry: {miss_home}')
              fails += 1
          else:
              print('OK   / homepage has fortune center entry card (button + sigil)')

          # 3) TopNav 7 模块项都应出现在所有 6 个真实页面（/chart 是 404 路由不查）
          pages = ['/', '/palm', '/qimen', '/liuyao', '/daliuren', '/xiaoliuren', '/fortune']
          nav_labels = ['紫微排盘', '手相', '奇门', '六爻', '大六壬', '小六壬', '运势']
          for p in pages:
              h = fetch(p)
              miss = [n for n in nav_labels if n not in h]
              if miss:
                  print(f'FAIL {p:14s} missing TopNav labels: {miss}')
                  fails += 1
              else:
                  print(f'OK   {p:14s} TopNav 7 items all present')

          if fails:
              sys.exit(f'R18-7 page check failed: {fails} issues')
          print('R18-7 PAGE CHECK: 7 pages, 1 homepage entry, 7 nav items all green')
          PY

